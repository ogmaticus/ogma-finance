name: Finance checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finpass
          POSTGRES_DB: finance
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finance" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/generate-release.mjs
      - run: npm run lint
      - run: npm run format:check
      - name: npm test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log || {
            # Хвост вывода — в аннотацию: так причину видно без доступа к логам.
            tail -40 test.log | python3 -c 'import sys;d=sys.stdin.read().replace("%","%25").replace("\r","").replace("\n","%0A");print("::error title=npm test::"+d[-3500:])'
            exit 1
          }
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start server v2
        run: |
          mkdir -p "$RUNNER_TEMP/files"
          export DATABASE_URL=postgres://finance:finpass@127.0.0.1:5432/finance
          export APP_SECRET=$(openssl rand -hex 32) FILES_KEY=$(openssl rand -hex 32)
          export FILES_DIR="$RUNNER_TEMP/files" PUBLIC_ORIGIN=http://127.0.0.1:3000 PORT=3000 HOST=127.0.0.1
          nohup npm run server > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/healthz && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/server.log"; exit 1
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finance-browser-results
          path: |
            test-results/
            playwright-report/
