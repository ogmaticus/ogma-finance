name: Backup run (manual)
# Запускает ночной бэкап сейчас и показывает итог в аннотациях запуска.
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - name: SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key; chmod 600 ~/.ssh/deploy_key
          printf 'Host server\n  HostName %s\n  User root\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking accept-new\n' "$HOST" > ~/.ssh/config
          ssh server true
      - name: Run backup
        run: |
          note() { printf '%s' "$2" | head -c 3500 | python3 -c 'import sys;d=sys.stdin.read().replace("%","%25").replace("\r","").replace("\n","%0A");print("::notice title='"$1"'::"+d)'; }
          note "config" "$(ssh server 'test -f /etc/finance/backup.env && { stat -c "%A %U %n" /etc/finance/backup.env; grep -E "^(S3_ENDPOINT|S3_REGION|S3_BUCKET|S3_PREFIX|S3_ADDRESSING)=" /etc/finance/backup.env; grep -q "^AGE_RECIPIENT=age1" /etc/finance/backup.env && echo "AGE_RECIPIENT: задан"; grep -q "^S3_ACCESS_KEY=." /etc/finance/backup.env && echo "S3 ключ: задан"; } || echo "backup.env НЕТ"')"
          rc=0; ssh server 'systemctl start finance-backup.service' || rc=$?
          note "result" "exit=$rc; $(ssh server 'systemctl show -p Result -p ExecMainStatus finance-backup.service | tr "\n" " "; echo; journalctl -u finance-backup.service --since "-10min" -o cat | tail -25')"
          exit $rc
