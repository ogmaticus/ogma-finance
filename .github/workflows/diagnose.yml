name: Diagnose server
# Ручная проверка состояния сервера. Результаты — в аннотациях запуска (notice).
# GitHub показывает не больше 10 аннотаций на шаг — важное держим в начале.
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: SSH key
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key; chmod 600 ~/.ssh/deploy_key
          printf 'Host server\n  HostName %s\n  User root\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking accept-new\n' "$HOST" > ~/.ssh/config
      - name: Checks
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          note() { printf '%s' "$2" | head -c 3000 | python3 -c 'import sys;d=sys.stdin.read().replace("%","%25").replace("\r","").replace("\n","%0A");print("::notice title='"$1"'::"+d)'; }
          note "dns" "$(for n in app.multiknopka.ru multiknopka.ru; do echo "$n: $(dig +short A $n @8.8.8.8 | tr '\n' ' ') (NS: $(dig +short NS multiknopka.ru @8.8.8.8 | tr '\n' ' '))"; done; for u in https://app.multiknopka.ru/ https://app.multiknopka.ru/login https://app.multiknopka.ru/healthz https://multiknopka.ru/ https://multiknopka.ru/privacy https://www.multiknopka.ru/x http://multiknopka.ru/ https://xn--80apgacfkijzj3i.xn--p1ai/ https://www.xn--80apgacfkijzj3i.xn--p1ai/; do curl -sS -m 10 -o /dev/null -w "$u -> %{http_code} %{redirect_url}\n" "$u" 2>&1; done; curl -sS -m 10 https://multiknopka.ru/ | grep -o "<title>[^<]*" | head -1; curl -sS -m 10 https://app.multiknopka.ru/api/session; curl -sSI -m 10 https://multiknopka.ru/ | grep -iE "^(content-security|cache-control|strict-transport)" )"
          note "secret-key" "$(ssh-keygen -y -f ~/.ssh/deploy_key | awk '{print $2}')"
          note "ssh-keys" "$(ssh server 'awk "{print \$NF}" /root/.ssh/authorized_keys' 2>&1)"
          note "external-http" "$(curl -sS -m 10 -o /dev/null -w 'HTTP %{http_code} %{redirect_url}' http://$HOST/finance 2>&1)"
          note "external-healthz" "$(curl -sS -m 10 http://$HOST/healthz 2>&1)"
          note "services" "$(ssh server 'for s in finance caddy postgresql finance-backup.timer; do echo "$s: $(systemctl is-active $s)"; done; ufw status | head -8' 2>&1)"
          note "local" "$(ssh server 'curl -sS -m 5 http://127.0.0.1:3000/healthz; echo; curl -sS -m 5 -o /dev/null -w "caddy:80 %{http_code}" http://127.0.0.1/finance' 2>&1)"
          note "finance-log" "$(ssh server 'journalctl -u finance -n 25 --no-pager -o cat' 2>&1)"
          note "caddy-log" "$(ssh server 'journalctl -u caddy -n 15 --no-pager -o cat; cat /etc/caddy/Caddyfile' 2>&1)"
          note "mail-config" "$(ssh server 'grep -E "^(MAIL_TRANSPORT|SMTP_HOST|SMTP_PORT|SMTP_SECURE|MAIL_FROM|ALERT_EMAIL)=" /etc/finance/finance.env | sed -E "s/(=).*@/\1***@/"; grep -q "^SMTP_PASSWORD=." /etc/finance/finance.env && echo "SMTP_PASSWORD: set"; timeout 8 bash -c "</dev/tcp/smtp.yandex.ru/465" && echo "smtp.yandex.ru:465 reachable"; ufw status | grep -c ispmanager' 2>&1)"
          note "smtp-check" "$(ssh server 'cd /opt/finance && timeout 20 node --env-file=/etc/finance/finance.env backend/smtp-check.mjs' 2>&1)"
          note "backup-last" "$(ssh server 'journalctl -u finance-backup --since "-30h" -o cat --no-pager | tail -6; ls -la /var/backups/finance | tail -3' 2>&1)"
          note "versions" "$(ssh server 'lsb_release -ds; node --version; psql --version; caddy version; age --version; df -h / | tail -1; free -m | head -2' 2>&1)"
