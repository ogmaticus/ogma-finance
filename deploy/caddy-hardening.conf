# Ограничения для Caddy поверх штатного caddy.service (устанавливается в
# /etc/systemd/system/caddy.service.d/10-ogma-hardening.conf скриптом harden-caddy.sh).
# Caddy нужно: слушать 80/443, читать /etc/caddy и /opt/finance/landing,
# писать сертификаты в /var/lib/caddy, ходить в Let's Encrypt и к приложению на 127.0.0.1:3000.
[Service]
NoNewPrivileges=true
ProtectSystem=strict
ReadWritePaths=/var/lib/caddy
LogsDirectory=caddy
ProtectHome=true
PrivateTmp=true
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
ProtectProc=invisible
ProcSubset=pid
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
MemoryDenyWriteExecute=true
RemoveIPC=true
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=CAP_NET_BIND_SERVICE
UMask=0077
